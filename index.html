<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ಸಂಕಲ್ಪ ಲೈವ್ ಟಿವಿ</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #090d16; color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #111827; padding: 14px 20px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.25rem; color: #38bdf8; letter-spacing: 0.3px; }
    .live-pill { font-size: 0.72rem; background: rgba(239, 68, 68, 0.18); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); padding: 3px 9px; border-radius: 999px; font-weight: 700; }
    .header-meta { font-size: 0.85rem; color: #94a3b8; }
    .main-container { display: grid; grid-template-columns: 1fr 360px; flex: 1; }
    .player-section { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .video-wrapper { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid #1f2937; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
    video, iframe { width: 100%; height: 100%; border: none; display: block; }
    video { object-fit: contain; }
    #ytFrame { display: none; }
    .info-bar { background: #111827; padding: 12px 16px; border-radius: 10px; border: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .now-playing { display: flex; align-items: center; gap: 10px; }
    .ch-number { background: #0c4a6e; color: #38bdf8; font-weight: 700; font-size: 0.8rem; padding: 4px 8px; border-radius: 6px; }
    .controls-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #e2e8f0; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
    .nav-btn:hover { border-color: #38bdf8; color: #38bdf8; }
    .status { font-size: 0.82rem; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
    .status.live { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status.loading { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .status.switching { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .sidebar { background: #111827; border-left: 1px solid #1f2937; display: flex; flex-direction: column; height: calc(100vh - 98px); }
    .sidebar-top { padding: 12px; border-bottom: 1px solid #1f2937; display: flex; flex-direction: column; gap: 10px; }
    .sidebar-top input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 0.9rem; }
    .sidebar-top input:focus { outline: none; border-color: #38bdf8; }
    .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .cat-btn { padding: 5px 11px; border-radius: 999px; border: 1px solid #374151; background: #1f2937; color: #cbd5e1; font-size: 0.8rem; cursor: pointer; white-space: nowrap; font-weight: 600; }
    .cat-btn.active { background: #0284c7; border-color: #0284c7; color: #fff; }
    .channel-list { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .channel-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; padding: 11px 12px; background: #1f2937; border: 1px solid transparent; border-radius: 8px; color: #e2e8f0; cursor: pointer; font-size: 0.93rem; gap: 8px; transition: background 0.15s, border-color 0.15s; }
    .channel-btn:hover, .channel-btn:focus { background: #263142; border-color: #38bdf8; outline: none; }
    .channel-btn.active { background: #0c4a6e; border-color: #38bdf8; color: #fff; font-weight: 600; }
    .ch-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ch-idx { font-size: 0.78rem; color: #94a3b8; width: 22px; flex-shrink: 0; }
    .channel-btn.active .ch-idx { color: #38bdf8; font-weight: 700; }
    .ch-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fta-tag { font-size: 0.7rem; background: #0f172a; color: #38bdf8; padding: 3px 7px; border-radius: 4px; flex-shrink: 0; }
    footer { background: #0b0f19; border-top: 1px solid #1f2937; padding: 10px 20px; font-size: 0.8rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 820px) {
      .main-container { grid-template-columns: 1fr; }
      .sidebar { height: auto; max-height: 50vh; border-left: none; border-top: 1px solid #1f2937; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>ಸಂಕಲ್ಪ ಲೈವ್ ಟಿವಿ</h1>
      <span class="live-pill">● 24/7 LIVE</span>
    </div>
    <span class="header-meta">ಉಚಿತ ಕನ್ನಡ &amp; ಎಚ್‌ಡಿ ಲೈವ್ ಚಾನೆಲ್‌ಗಳು</span>
  </header>

  <div class="main-container">
    <div class="player-section">
      <div class="video-wrapper">
        <video id="videoPlayer" controls muted autoplay playsinline></video>
        <iframe id="ytFrame" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      <div class="info-bar">
        <div class="now-playing">
          <span class="ch-number" id="nowPlayingNumber">CH 01</span>
          <strong id="nowPlayingTitle">ಚಾನೆಲ್ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</strong>
        </div>
        <div class="controls-right">
          <span id="streamStatus" class="status loading">ಕನೆಕ್ಟ್ ಆಗುತ್ತಿದೆ</span>
          <button type="button" class="nav-btn" onclick="switchChannel(-1)">⏮ ಹಿಂದಿನ</button>
          <button type="button" class="nav-btn" onclick="switchChannel(1)">ಮುಂದಿನ ⏭</button>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-top">
        <input type="search" id="channelFilterBox" autocomplete="off" placeholder="ಚಾನೆಲ್ ಹುಡುಕಿ..." oninput="renderChannels()" />
        <div class="cat-tabs" id="catTabs">
          <button type="button" class="cat-btn active" onclick="setCategory('ಎಲ್ಲಾ', this)">ಎಲ್ಲಾ</button>
          <button type="button" class="cat-btn" onclick="setCategory('ಸುದ್ದಿ', this)">ಸುದ್ದಿ</button>
          <button type="button" class="cat-btn" onclick="setCategory('ಮನರಂಜನೆ', this)">ಮನರಂಜನೆ</button>
          <button type="button" class="cat-btn" onclick="setCategory('ಸಿನಿಮಾ & ಅನಿಮೇಷನ್', this)">ಸಿನಿಮಾ</button>
        </div>
      </div>
      <div class="channel-list" id="channelList"></div>
    </aside>
  </div>

  <footer>
    <span>ಇಲ್ಲಿರುವ ಎಲ್ಲಾ ಸ್ಟ್ರೀಮ್‌ಗಳು ಸಾರ್ವಜನಿಕವಾಗಿ ಲಭ್ಯವಿರುವ Free-to-Air ಫೀಡ್‌ಗಳಾಗಿವೆ; ಹಕ್ಕುಗಳು ಆಯಾ ಪ್ರಸಾರಕರಿಗೆ ಸೇರಿವೆ.</span>
    <span>ಸಂಪರ್ಕ: contact@indoworkspace.in</span>
  </footer>

  <script>
    // ಎಲ್ಲಾ ಚಾನೆಲ್‌ಗಳ ಲೈವ್ ಲಿಂಕ್‌ಗಳನ್ನು ನೇರವಾಗಿ ಇಲ್ಲಿಯೇ ಜೋಡಿಸಲಾಗಿದೆ
    const CHANNELS = [
      {
        name: 'ಟಿವಿ9 ಕನ್ನಡ (TV9 Kannada)',
        category: 'ಸುದ್ದಿ',
        url: 'https://www.youtube.com/embed/live_stream?channel=UC8dnBi4WUErqYQHZ4PfsLTg'
      },
      {
        name: 'ಪಬ್ಲಿಕ್ ಟಿವಿ (Public TV)',
        category: 'ಸುದ್ದಿ',
        url: 'https://www.youtube.com/embed/live_stream?channel=UCl-OodciBGZ0k8K8rBZGe4w'
      },
      {
        name: 'ಏಷ್ಯಾನೆಟ್ ಸುವರ್ಣ ನ್ಯೂಸ್ (Suvarna News)',
        category: 'ಸುದ್ದಿ',
        url: 'https://www.youtube.com/embed/live_stream?channel=UCjElJyiXmQXnWmceQ1JyKrA'
      },
      {
        name: 'ನ್ಯೂಸ್18 ಕನ್ನಡ (News18 Kannada)',
        category: 'ಸುದ್ದಿ',
        url: 'https://www.youtube.com/embed/live_stream?channel=UCa-vioGhe2btBcZneaPonKA'
      },
      {
        name: 'ಸಂಕಲ್ಪ ಎಚ್‌ಡಿ ಲೈವ್ (Sankalpa HD)',
        category: 'ಮನರಂಜನೆ',
        url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
      },
      {
        name: 'ಸಂಕಲ್ಪ ಸಿನಿಮಾ ಎಚ್‌ಡಿ (Tears of Steel)',
        category: 'ಸಿನಿಮಾ & ಅನಿಮೇಷನ್',
        url: 'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8'
      },
      {
        name: 'ಸಂಕಲ್ಪ ಅನಿಮೇಷನ್ ಎಚ್‌ಡಿ (Sintel HD)',
        category: 'ಸಿನಿಮಾ & ಅನಿಮೇಷನ್',
        url: 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8'
      },
      {
        name: 'ಸಂಕಲ್ಪ ಲೈವ್ ಸ್ಟ್ರೀಮ್ 8 (Apple HD)',
        category: 'ಮನರಂಜನೆ',
        url: 'https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8'
      }
    ];

    let currentIndex = 0;
    let activeCategory = 'ಎಲ್ಲಾ';
    let hlsInstance = null;
    let stallTimer = null;
    let switchTimer = null;
    let failedIndices = new Set();

    function setCategory(cat, btnEl) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderChannels();
    }

    function renderChannels() {
      const listEl = document.getElementById('channelList');
      const query = document.getElementById('channelFilterBox').value.toLowerCase().trim();
      listEl.innerHTML = '';

      const filtered = CHANNELS
        .map((ch, idx) => ({ ...ch, idx }))
        .filter(ch => {
          const matchCat = activeCategory === 'ಎಲ್ಲಾ' || ch.category === activeCategory;
          const matchSearch = !query || ch.name.toLowerCase().includes(query) || ch.category.toLowerCase().includes(query);
          return matchCat && matchSearch;
        });

      if (filtered.length === 0) {
        listEl.innerHTML = '<p style="padding:14px;color:#94a3b8;font-size:0.9rem;">ಯಾವುದೇ ಚಾನೆಲ್ ಕಂಡುಬಂದಿಲ್ಲ.</p>';
        return;
      }

      filtered.forEach(ch => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'channel-btn' + (ch.idx === currentIndex ? ' active' : '');
        btn.onclick = () => {
          failedIndices.clear();
          selectChannel(ch.idx, true);
        };

        const left = document.createElement('span');
        left.className = 'ch-left';

        const num = document.createElement('span');
        num.className = 'ch-idx';
        num.textContent = String(ch.idx + 1).padStart(2, '0');

        const title = document.createElement('span');
        title.className = 'ch-title';
        title.textContent = ch.name;

        left.appendChild(num);
        left.appendChild(title);

        const tag = document.createElement('span');
        tag.className = 'fta-tag';
        tag.textContent = ch.category;

        btn.appendChild(left);
        btn.appendChild(tag);
        listEl.appendChild(btn);
      });
    }

    function switchChannel(step) {
      failedIndices.clear();
      const next = (currentIndex + step + CHANNELS.length) % CHANNELS.length;
      selectChannel(next, true);
    }

    function handleStreamFailure(reason) {
      clearTimeout(stallTimer);
      clearTimeout(switchTimer);

      const status = document.getElementById('streamStatus');
      failedIndices.add(currentIndex);

      if (failedIndices.size >= CHANNELS.length) {
        failedIndices.clear();
      }

      let nextIdx = (currentIndex + 1) % CHANNELS.length;
      while (failedIndices.has(nextIdx) && failedIndices.size < CHANNELS.length) {
        nextIdx = (nextIdx + 1) % CHANNELS.length;
      }

      status.textContent = reason + ' — ಮುಂದಿನ ಚಾನೆಲ್‌ಗೆ ಬದಲಾಗುತ್ತಿದೆ...';
      status.className = 'status switching';

      switchTimer = setTimeout(() => {
        selectChannel(nextIdx, false);
      }, 1500);
    }

    function selectChannel(index, userInitiated) {
      clearTimeout(stallTimer);
      clearTimeout(switchTimer);

      const ch = CHANNELS[index];
      if (!ch) return;

      currentIndex = index;
      renderChannels();

      const video = document.getElementById('videoPlayer');
      const ytFrame = document.getElementById('ytFrame');
      const status = document.getElementById('streamStatus');
      const title = document.getElementById('nowPlayingTitle');
      const numBadge = document.getElementById('nowPlayingNumber');

      numBadge.textContent = 'CH ' + String(index + 1).padStart(2, '0');
      title.textContent = ch.name;
      status.textContent = 'ಕನೆಕ್ಟ್ ಆಗುತ್ತಿದೆ...';
      status.className = 'status loading';

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      video.pause();
      video.removeAttribute('src');
      video.load();
      ytFrame.src = 'about:blank';

      if (ch.url.includes('youtube.com/embed/')) {
        video.style.display = 'none';
        ytFrame.style.display = 'block';
        const muteParam = userInitiated ? '0' : '1';
        const sep = ch.url.includes('?') ? '&' : '?';
        ytFrame.src = ch.url + sep + 'autoplay=1&mute=' + muteParam + '&rel=0';
        status.textContent = '● ಲೈವ್ ಪ್ಲೇ ಆಗುತ್ತಿದೆ';
        status.className = 'status live';
        failedIndices.clear();
        return;
      }

      ytFrame.style.display = 'none';
      video.style.display = 'block';
      video.muted = !userInitiated;

      stallTimer = setTimeout(() => {
        handleStreamFailure('ಸಂಪರ್ಕ ವಿಳಂಬ');
      }, 8000);

      if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(ch.url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          clearTimeout(stallTimer);
          failedIndices.clear();
          video.play().catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
          status.textContent = '● ಲೈವ್ ಪ್ಲೇ ಆಗುತ್ತಿದೆ';
          status.className = 'status live';
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            handleStreamFailure('ಸ್ಟ್ರೀಮ್ ಆಫ್‌ಲೈನ್');
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ch.url;
        video.addEventListener('loadedmetadata', () => {
          clearTimeout(stallTimer);
          failedIndices.clear();
          video.play().catch(() => {});
          status.textContent = '● ಲೈವ್ ಪ್ಲೇ ಆಗುತ್ತಿದೆ';
          status.className = 'status live';
        }, { once: true });
        video.addEventListener('error', () => {
          handleStreamFailure('ಸ್ಟ್ರೀಮ್ ಆಫ್‌ಲೈನ್');
        }, { once: true });
      } else {
        handleStreamFailure('ಬ್ರೌಸರ್ ಬೆಂಬಲವಿಲ್ಲ');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectChannel(0, false);
    });
  </script>
</body>
</html>
