<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ಸಂಕಲ್ಪ ಲೈವ್ ಸ್ಟ್ರೀಮ್</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #111827; padding: 14px 20px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 1.2rem; color: #38bdf8; }
    .test-bar { display: flex; gap: 8px; flex: 1; max-width: 520px; }
    .test-bar input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 0.9rem; }
    .test-bar button { padding: 8px 14px; border-radius: 6px; border: none; background: #0284c7; color: #fff; font-weight: 600; cursor: pointer; }
    .test-bar button:hover { background: #0369a1; }
    .main-container { display: grid; grid-template-columns: 1fr 340px; flex: 1; }
    .player-section { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .video-wrapper { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid #1f2937; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .info-bar { background: #111827; padding: 12px 16px; border-radius: 8px; border: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .status { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
    .status.live { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status.loading { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .status.error { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .sidebar { background: #111827; border-left: 1px solid #1f2937; display: flex; flex-direction: column; height: calc(100vh - 60px); }
    .search-box { padding: 12px; border-bottom: 1px solid #1f2937; }
    .search-box input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #fff; }
    .channel-list { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .channel-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; background: #1f2937; border: 1px solid transparent; border-radius: 8px; color: #e2e8f0; cursor: pointer; font-size: 0.95rem; }
    .channel-btn:hover, .channel-btn:focus { background: #263142; border-color: #38bdf8; outline: none; }
    .channel-btn.active { background: #0c4a6e; border-color: #38bdf8; color: #fff; font-weight: 600; }
    .channel-logo { width: 32px; height: 32px; border-radius: 6px; object-fit: contain; background: #0f172a; padding: 2px; flex-shrink: 0; }
    @media (max-width: 820px) {
      .main-container { grid-template-columns: 1fr; }
      .sidebar { height: 50vh; border-left: none; border-top: 1px solid #1f2937; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ಸಂಕಲ್ಪ ಲೈವ್ ಟಿವಿ</h1>
    <div class="test-bar">
      <input type="text" id="customUrlInput" placeholder="ಯಾವುದೇ .m3u8 ಸ್ಟ್ರೀಮ್ ಲಿಂಕ್ ಇಲ್ಲಿ ಹಾಕಿ ಪರೀಕ್ಷಿಸಿ..." />
      <button onclick="playCustomUrl()">ಪ್ಲೇ ಮಾಡಿ</button>
    </div>
  </header>

  <div class="main-container">
    <div class="player-section">
      <div class="video-wrapper">
        <video id="videoPlayer" controls autoplay playsinline></video>
      </div>
      <div class="info-bar">
        <strong id="nowPlayingTitle">ಚಾನೆಲ್ ಆಯ್ಕೆ ಮಾಡಿ</strong>
        <span id="streamStatus" class="status loading">ಸಿದ್ಧವಾಗಿದೆ</span>
      </div>
    </div>

    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ಚಾನೆಲ್ ಹುಡುಕಿ..." oninput="filterChannels()" />
      </div>
      <div class="channel-list" id="channelList"></div>
    </aside>
  </div>

  <script>
    const PLAYLIST_URL = 'https://iptv-org.github.io/iptv/languages/kan.m3u';
    const DEFAULT_CHANNELS = [
      {
        name: 'ಸಂಕಲ್ಪ ಎಚ್‌ಡಿ ಟೆಸ್ಟ್ ಸ್ಟ್ರೀಮ್',
        url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
        logo: ''
      }
    ];

    let allChannels = [...DEFAULT_CHANNELS];
    let hlsInstance = null;

    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const parsed = [];
      let current = null;

      for (const raw of lines) {
        const line = raw.trim();
        if (line.startsWith('#EXTINF:')) {
          const parts = line.split(',');
          const name = parts.length > 1 ? parts[parts.length - 1].trim() : 'ಲೈವ್ ಚಾನೆಲ್';
          const logoMatch = line.match(/tvg-logo="([^"]*)"/);
          current = { name, logo: logoMatch ? logoMatch[1] : '' };
        } else if (line && !line.startsWith('#') && current) {
          current.url = line;
          parsed.push(current);
          current = null;
        }
      }
      return parsed;
    }

    function renderChannels(channels) {
      const listEl = document.getElementById('channelList');
      listEl.innerHTML = '';

      if (channels.length === 0) {
        listEl.innerHTML = '<p style="padding:12px;color:#94a3b8;">ಯಾವುದೇ ಚಾನೆಲ್ ಕಂಡುಬಂದಿಲ್ಲ.</p>';
        return;
      }

      channels.forEach((ch, index) => {
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        btn.onclick = () => playStream(ch.url, ch.name, btn);

        if (ch.logo) {
          const img = document.createElement('img');
          img.src = ch.logo;
          img.className = 'channel-logo';
          img.onerror = () => { img.style.display = 'none'; };
          btn.appendChild(img);
        }

        const span = document.createElement('span');
        span.textContent = ch.name;
        btn.appendChild(span);
        listEl.appendChild(btn);

        if (index === 0 && !hlsInstance) {
          playStream(ch.url, ch.name, btn);
        }
      });
    }

    function filterChannels() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(q));
      renderChannels(filtered);
    }

    function playCustomUrl() {
      const url = document.getElementById('customUrlInput').value.trim();
      if (!url) return;
      playStream(url, 'ಕಸ್ಟಮ್ ಲೈವ್ ಸ್ಟ್ರೀಮ್', null);
    }

    function playStream(url, name, btnEl) {
      const video = document.getElementById('videoPlayer');
      const status = document.getElementById('streamStatus');
      const title = document.getElementById('nowPlayingTitle');

      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      title.textContent = name;
      status.textContent = 'ಕನೆಕ್ಟ್ ಆಗುತ್ತಿದೆ...';
      status.className = 'status loading';

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          status.textContent = '● ಲೈವ್ ಪ್ಲೇ ಆಗುತ್ತಿದೆ';
          status.className = 'status live';
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            status.textContent = 'ಈ ಸ್ಟ್ರೀಮ್ ಸದ್ಯಕ್ಕೆ ಲಭ್ಯವಿಲ್ಲ ಅಥವಾ ಬ್ರೌಸರ್ ನಿರ್ಬಂಧವಿದೆ. ಬೇರೆ ಚಾನೆಲ್ ಆಯ್ಕೆ ಮಾಡಿ.';
            status.className = 'status error';
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {});
          status.textContent = '● ಲೈವ್ ಪ್ಲೇ ಆಗುತ್ತಿದೆ';
          status.className = 'status live';
        }, { once: true });
      } else {
        status.textContent = 'ನಿಮ್ಮ ಬ್ರೌಸರ್ ಈ ಸ್ಟ್ರೀಮ್ ಬೆಂಬಲಿಸುವುದಿಲ್ಲ.';
        status.className = 'status error';
      }
    }

    async function init() {
      renderChannels(allChannels);
      try {
        const res = await fetch(PLAYLIST_URL);
        if (res.ok) {
          const text = await res.text();
          const fetched = parseM3U(text);
          if (fetched.length > 0) {
            allChannels = [...DEFAULT_CHANNELS, ...fetched];
            renderChannels(allChannels);
          }
        }
      } catch (err) {
        console.warn('ಪಬ್ಲಿಕ್ ಪ್ಲೇಲಿಸ್ಟ್ ಲೋಡ್ ಆಗಲಿಲ್ಲ:', err);
      }
    }

    init();
  </script>
</body>
</html>
